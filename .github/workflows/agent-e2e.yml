name: agent-e2e

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: MCP target, the headless stdio server or a Studio tab over the live bridge
        type: choice
        options: [stdio, bridge]
        default: stdio
      model:
        description: xAI model id (empty uses the harness default)
        required: false
        default: ""
      tasks:
        description: comma separated task ids (empty runs every task)
        required: false
        default: ""
  pull_request:
    paths:
      - scripts/agent-e2e/**
      - apps/studio/**
      - packages/mcp-server/**
      - packages/timeline/**
      - .github/workflows/agent-e2e.yml

permissions:
  contents: read

concurrency: agent-e2e

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@mcut/mcp-server...
      - run: bunx tsc --noEmit -p scripts/agent-e2e/tsconfig.json
      - run: bun test scripts/agent-e2e
      - name: Replay the scripted tool calls through the MCP server
        shell: bash
        run: bun scripts/agent-e2e/run.ts --dry-run | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agent-e2e-dry-run
          path: reports/agent-e2e
          retention-days: 14

  bridge-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=mcut-studio-web...
      - run: bunx playwright install --with-deps chromium
      - name: Install Grok Build
        run: |
          curl -fsSL https://x.ai/cli/install.sh | bash
          echo "$HOME/.grok/bin" >> "$GITHUB_PATH"
          "$HOME/.grok/bin/grok" --version
      - name: Replay the scripted tool calls, including the WebM export, through a Studio tab over the live bridge
        shell: bash
        run: bun scripts/agent-e2e/run.ts --dry-run --target bridge | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check that grok discovers the bridge config and completes the MCP handshake
        shell: bash
        run: bun scripts/agent-e2e/run.ts --dry-run --target bridge --driver grok-build | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fuzz the live bridge with 20 random tool sequences
        shell: bash
        run: bun run fuzz:mcp:bridge | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agent-e2e-bridge-dry-run
          path: reports/agent-e2e
          retention-days: 14

  live:
    if: github.event_name != 'pull_request'
    needs: [dry-run, bridge-dry-run]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      XAI_MODEL: ${{ inputs.model }}
      TASK_IDS: ${{ inputs.tasks }}
      TARGET: ${{ inputs.target || 'stdio' }}
    steps:
      - name: Check for the xAI key
        id: key
        run: |
          if [ -z "$XAI_API_KEY" ]; then
            echo "::notice title=agent-e2e live run skipped::The XAI_API_KEY secret is empty. Add it under repository secrets to drive the MCP server with an xAI model."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.key.outputs.present == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.key.outputs.present == 'true'
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        if: steps.key.outputs.present == 'true'
      - run: bunx turbo run build --filter=@mcut/mcp-server...
        if: steps.key.outputs.present == 'true' && env.TARGET == 'stdio'
      - run: bunx turbo run build --filter=mcut-studio-web...
        if: steps.key.outputs.present == 'true' && env.TARGET == 'bridge'
      - run: bunx playwright install --with-deps chromium
        if: steps.key.outputs.present == 'true' && env.TARGET == 'bridge'
      - name: Drive the MCP server with xAI
        if: steps.key.outputs.present == 'true'
        shell: bash
        run: |
          args=(--target "$TARGET")
          IFS=',' read -ra ids <<< "$TASK_IDS"
          for id in "${ids[@]}"; do
            id="$(echo "$id" | xargs)"
            if [ -n "$id" ]; then args+=(--task "$id"); fi
          done
          bun scripts/agent-e2e/run.ts "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: agent-e2e-live
          path: reports/agent-e2e
          retention-days: 30

  bridge-live:
    if: github.event_name != 'pull_request'
    needs: [dry-run, bridge-dry-run]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      TASK_IDS: ${{ inputs.tasks }}
    steps:
      - name: Check for the xAI key
        id: key
        run: |
          if [ -z "$XAI_API_KEY" ]; then
            echo "::notice title=agent-e2e bridge live run skipped::The XAI_API_KEY secret is empty. Add it under repository secrets to let Grok Build edit a Studio tab over the live bridge."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.key.outputs.present == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.key.outputs.present == 'true'
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        if: steps.key.outputs.present == 'true'
      - run: bunx turbo run build --filter=mcut-studio-web...
        if: steps.key.outputs.present == 'true'
      - run: bunx playwright install --with-deps chromium
        if: steps.key.outputs.present == 'true'
      - name: Install Grok Build
        if: steps.key.outputs.present == 'true'
        run: |
          curl -fsSL https://x.ai/cli/install.sh | bash
          echo "$HOME/.grok/bin" >> "$GITHUB_PATH"
          "$HOME/.grok/bin/grok" --version
      - name: Let Grok Build run the tasks against a Studio tab over the live bridge
        if: steps.key.outputs.present == 'true'
        shell: bash
        run: |
          args=(--target bridge --driver grok-build)
          IFS=',' read -ra ids <<< "$TASK_IDS"
          for id in "${ids[@]}"; do
            id="$(echo "$id" | xargs)"
            if [ -n "$id" ]; then args+=(--task "$id"); fi
          done
          bun scripts/agent-e2e/run.ts "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: agent-e2e-bridge-live
          path: reports/agent-e2e
          retention-days: 30
