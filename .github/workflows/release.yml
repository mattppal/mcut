name: Release

on:
  push:
    branches: [main]
    paths:
      - ".changeset/**"
      - ".github/workflows/release.yml"
      - ".npmpackagejsonlintrc.json"
      - "package.json"
      - "packages/**"
      - "scripts/**"
      - "tsconfig*.json"
      - "turbo.json"
  workflow_dispatch:

concurrency: release

permissions:
  contents: write
  id-token: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: sudo apt-get install -y -qq xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
      - run: bunx playwright install chromium
        working-directory: apps/studio
      - run: bun run release:check
      - name: Version packages on main
        # The repository blocks GITHUB_TOKEN from opening pull requests, so the version bump is committed to main directly. A push made with GITHUB_TOKEN starts no other workflow. https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bunx changeset version
          git add -A
          if git diff --cached --quiet; then
            echo "No pending changesets"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): version packages"
          git push origin HEAD:${{ github.ref_name }}
      - uses: changesets/action@v1
        id: changesets
        with:
          publish: bun run release:publish
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      - name: Mirror published packages to GitHub Packages
        if: steps.changesets.outputs.published == 'true'
        run: bun run release:github-packages
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
