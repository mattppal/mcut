name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: git rev-parse --is-shallow-repository; git rev-list --count HEAD; ls .git/shallow && cat .git/shallow || true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: bun install --frozen-lockfile
      - run: git rev-parse --is-shallow-repository; git rev-list --count HEAD; ls .git/shallow && cat .git/shallow || true
      - run: bun run fixtures
      - run: git rev-parse --is-shallow-repository; git rev-list --count HEAD; ls .git/shallow && cat .git/shallow || true
      - run: sudo apt-get install -y -qq xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
      - run: bunx playwright install chromium
        working-directory: apps/studio
      - run: bun run build
      - run: git rev-parse --is-shallow-repository; git rev-list --count HEAD; ls .git/shallow && cat .git/shallow || true
      - run: bun run typecheck
      - run: git rev-parse --is-shallow-repository; git rev-list --count HEAD; ls .git/shallow && cat .git/shallow || true
      - run: bun run test
      - run: git rev-parse --is-shallow-repository; git rev-list --count HEAD; ls .git/shallow && cat .git/shallow || true
      - run: bun run lint
      - run: git rev-parse --is-shallow-repository; git rev-list --count HEAD; ls .git/shallow && cat .git/shallow || true
      - run: bun run smoke:packages
      - run: git rev-parse --is-shallow-repository; git rev-list --count HEAD; ls .git/shallow && cat .git/shallow || true
      - run: bun run package:lint
      - run: git rev-parse --is-shallow-repository; git rev-list --count HEAD; ls .git/shallow && cat .git/shallow || true
      - run: bun run standards
      - run: git rev-parse --is-shallow-repository; git rev-list --count HEAD; ls .git/shallow && cat .git/shallow || true
      - run: bun run knip
      - run: git diff --exit-code
      - name: Check package preview scope
        id: package_preview_scope
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > "$RUNNER_TEMP/changed-files.txt"
          if grep -Eq '^(\.changeset/|\.github/workflows/(ci|release)\.yml|\.npmpackagejsonlintrc\.json|package\.json|packages/|scripts/|tsconfig.*\.json|turbo\.json)' "$RUNNER_TEMP/changed-files.txt"; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
      - run: bunx pkg-pr-new publish --bun --compact ./packages/*
        if: steps.package_preview_scope.outputs.should_publish == 'true'
