name: e2e

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency: e2e

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, which blocks the Chromium sandbox. https://github.com/microsoft/playwright/issues/34251
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" -- bun run e2e
        working-directory: apps/studio
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/studio/playwright-report
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: apps/studio/test-results
          retention-days: 14
