name: e2e

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency: e2e

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/studio
      - run: bun run e2e
        working-directory: apps/studio
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/studio/playwright-report
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: apps/studio/test-results
          retention-days: 14
