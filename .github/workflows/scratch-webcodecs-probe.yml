name: scratch-webcodecs-probe

on:
  pull_request:

jobs:
  macos-15:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Electron
        working-directory: scripts/scratch
        run: |
          printf '%s\n' '{"type":"module"}' > package.json
          npm install --no-save electron@latest
      - name: Probe WebCodecs
        working-directory: scripts/scratch
        run: npx electron webcodecs-probe.mjs

  ubuntu-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Install Electron
        working-directory: scripts/scratch
        run: |
          printf '%s\n' '{"type":"module"}' > package.json
          npm install --no-save electron@latest
      - name: Probe WebCodecs
        working-directory: scripts/scratch
        run: xvfb-run --auto-servernum -- npx electron --no-sandbox --disable-gpu webcodecs-probe.mjs
