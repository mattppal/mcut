name: desktop

on:
  pull_request:
    paths:
      - apps/desktop/**
      - .github/workflows/desktop.yml
  push:
    tags:
      - mcut-desktop@*
  workflow_dispatch:
    inputs:
      version:
        description: Desktop version to publish as a GitHub Release, for example 0.1.0. Leave empty to build without publishing.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=mcut-desktop
      - run: bun run --cwd apps/desktop dist:linux
      - run: sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, which blocks the Chromium sandbox. https://github.com/microsoft/playwright/issues/34251
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Smoke the AppImage
        # The runner image ships no libfuse2, so the AppImage runtime extracts itself instead of mounting. https://github.com/AppImage/AppImageKit/wiki/FUSE
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" -- node apps/desktop/scripts/smoke-packaged.ts apps/desktop/release/*.AppImage
      - name: Record artifact sizes
        run: |
          echo '### Linux artifacts' >> "$GITHUB_STEP_SUMMARY"
          du -m apps/desktop/release/*.AppImage | awk '{ $1 = $1 " MB"; print "- " $0 }' | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: mcut-studio-linux
          path: apps/desktop/release/*.AppImage
          retention-days: 14

  mac:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MAC_CERTIFICATE_PRESENT: ${{ secrets.MAC_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=mcut-desktop
      # Secrets are not passed to workflows triggered by a pull request from a fork, so those builds fall back to ad-hoc signing. https://docs.github.com/en/actions/security-for-github-actions/security-guides/using-secrets-in-github-actions
      - name: Export the signing secrets
        if: github.event_name != 'pull_request' && env.MAC_CERTIFICATE_PRESENT == 'true'
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "CSC_LINK=$MAC_CERTIFICATE_P12"
            echo "CSC_KEY_PASSWORD=$MAC_CERTIFICATE_PASSWORD"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
      - run: bun run --cwd apps/desktop dist:mac
        # electron-builder skips macOS signing on pull request builds unless this is set. Ad-hoc signing uses no certificate, so nothing secret is exposed. https://github.com/electron-userland/electron-builder/blob/master/packages/app-builder-lib/src/codeSign/mac/macCodeSign.ts
        env:
          CSC_FOR_PULL_REQUEST: 'true'
      - name: Verify the signature
        env:
          MODE: ${{ env.CSC_LINK != '' && 'developer-id' || 'ad-hoc' }}
        run: apps/desktop/scripts/verify-mac-signature.sh "$MODE" "apps/desktop/release/mac-arm64/mcut Studio.app" "apps/desktop/release/mac/mcut Studio.app"
      - name: Smoke the app for the runner architecture
        run: |
          case "$(uname -m)" in
            arm64) app="apps/desktop/release/mac-arm64/mcut Studio.app" ;;
            *) app="apps/desktop/release/mac/mcut Studio.app" ;;
          esac
          node apps/desktop/scripts/smoke-packaged.ts "$app/Contents/MacOS/mcut Studio"
      - name: Record artifact sizes
        run: |
          echo '### macOS artifacts' >> "$GITHUB_STEP_SUMMARY"
          du -m apps/desktop/release/*.dmg | awk '{ $1 = $1 " MB"; print "- " $0 }' | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: mcut-studio-mac
          path: apps/desktop/release/*.dmg
          retention-days: 14

  release:
    needs: [linux, mac]
    if: startsWith(github.ref, 'refs/tags/mcut-desktop@') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Resolve the release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#mcut-desktop@}}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            0.* | *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/download-artifact@v8
        with:
          pattern: mcut-studio-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: mcut-desktop@${{ steps.version.outputs.version }}
          name: mcut Studio ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/mcut-studio-${{ steps.version.outputs.version }}-linux-x86_64.AppImage
            release/mcut-studio-${{ steps.version.outputs.version }}-mac-x64.dmg
            release/mcut-studio-${{ steps.version.outputs.version }}-mac-arm64.dmg
