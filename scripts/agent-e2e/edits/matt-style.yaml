# Matt's talking head plus screen recipe, one prompt per edit, run in order on one project.
# Media comes from --media: a camera clip, a screen recording, and a separate audio file.
edits:
  - id: 01-multicam
    ask: Put the talking track, the screen recording, and the audio file together as one synced multicam clip. Use the separate audio file as the audio source.
    checks: [multicam sources 3, multicam audio from audio file]
    capability: exists
    note: createMulticam takes the audio file as a source, and audioSource defaults to the first audio-only source.
  - id: 02-layout
    ask: Make the base layout the screen recording full frame with my head overlaid in the bottom right corner. Make the head shot narrow and tall, about 0.66 wide over tall (a touch wider than 9:16), about 16% of the frame width and 43% of its height, with about a 2% margin from the right and bottom edges. Give it slightly rounded corners and a drop shadow, with no border stroke.
    checks: [head overlay aspect 0.62-0.70, head overlay matches reference, head overlay without border, head overlay styled]
    capability: exists
    note: saveLayout with a narrow slot rect and cover fit crops the head. The size and margins are Matt's approved reference look.
  - id: 02c-center-person
    ask: Keep my head centered in the overlay when I move around.
    checks: [head overlay follows the person]
    capability: exists
    note: center_person on the live bridge finds the face in the camera source on this device and writes a reframe track on that source. The slot rect keeps the aspect.
  - id: 03-retakes
    transcript: matt-transcript.json
    ask: Find the retakes and remove them, keeping the good take each time, then re-caption what remains so the captions stay in sync with the speech.
    checks: [duration shorter by at most 60s, retakes removed, captions in sync]
    note: The runner applies Matt's word-timed transcript with apply_captions first, as a transcription provider would.
  - id: 04-captions
    ask: Transcribe the audio and add captions.
    checks: [transcript, captions]
    capability: exists
    note: Desktop transcription downloads a Whisper model from huggingface.co on first use.
  - id: 05-shots
    ask: Start on the shot of my head, and after my first pause add a slight zoom in on me. When I start talking about what's on my screen, cut to the screen with my head in the corner, and cut back to just my head when I'm talking to the camera. Keep every zoom subtle with exponential easing and motion blur.
    checks:
      [
        opens on head only,
        opening punch-in on camera at a pause,
        head shot at 18s 26s,
        screen shot at 37s 57s 190s,
        subtle zoom,
        exponential easing,
        motion blur,
      ]
    note: Shot times are on Matt's source clock. 15 to about 34 s he tells the story to camera. At 35 s "this report is generated entirely by Grokbot" the Daily Brief page is up, at 57 s he points at Karen Chang's post "that she's sharing here", and at 190 s he talks about Grokbot running commands on his computer while the chat view is up.
  - id: 07-detail-zoom
    ask: Each time the printed Daily Brief page (the white sheet with Events, Affirmations, and Journaling sections, shown large in the middle of the screen) is on screen, zoom into it on the screen recording with the same easing and motion blur, keep the zoom subtle, hold while it stays on screen, then zoom back out before it leaves.
    checks: [zoom in hold out, subtle zoom, exponential easing, motion blur, zoom on screen source, zoom covers 0-44.9s 99.3-138.7s 235.9-251.9s]
    capability: partial
    note: find_scene_changes and get_contact_sheet locate the page's visits. The full page is on screen 0 to 44.9 s, 99.3 to 138.7 s, and 235.9 to 251.9 s in Matt's footage. Chat views with a small thumbnail of the page don't count.
  - id: 08-export
    ask: Export the video.
    checks: [export job done, exported overlay styled]
    capability: exists
